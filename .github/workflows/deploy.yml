name: Deploy Live Frontend to S3 + CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          REACT_APP_AWS_API_URL: ${{ secrets.REACT_APP_AWS_API_URL }}
          REACT_APP_AWS_API_KEY: ${{ secrets.REACT_APP_AWS_API_KEY }}
          REACT_APP_ORG_ID: ${{ secrets.REACT_APP_ORG_ID }}
          CI: false

      - name: Deploy to S3
        run: |
          echo "=== Build directory contents ==="
          ls -la build/
          ls -la build/static/js/ || echo "No static/js directory!"
          echo "=== Syncing to S3 ==="
          aws s3 sync build/ s3://chartreview-pro-live-frontend --delete --no-progress
          echo "=== Verifying JS in S3 ==="
          aws s3 ls s3://chartreview-pro-live-frontend/static/js/ || echo "WARNING: static/js not found in S3"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id E2STTW7YKJZV1U --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
